name: Deploy static page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files
        run: |
          mkdir -p public/assets
          cp index.html privacy.html style.css app.js config.js public/
          cp assets/* public/assets/
      - name: Create optimized web images
        run: |
          python -m pip install --quiet Pillow
          python - <<'PYIMAGES'
          from pathlib import Path
          from PIL import Image, ImageOps
          for source in Path('public/assets').glob('peel-*.png'):
              with Image.open(source) as original:
                  image = ImageOps.exif_transpose(original).convert('RGB')
                  image.save(source.with_suffix('.webp'), 'WEBP', quality=85, method=6)
                  image.thumbnail((640, 800))
                  image.save(source.with_name(source.stem + '-640.webp'), 'WEBP', quality=82, method=6)
          PYIMAGES
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

